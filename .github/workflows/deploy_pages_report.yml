name: Execute Tests & Deploy Showcase to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java for PySpark Execution
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyspark pytest markdown requests

      - name: Run PySpark Gold Variance Engine
        run: |
          python lakehouse_pipeline/03_gold_circor_variance_engine.py > test_run_variance_output.txt

      - name: Run Automated UAT Test Suite
        run: |
          pytest tests/test_circor_uat_matrix.py -v >> test_run_variance_output.txt

      - name: Generate Standalone Showcase HTML Report
        run: |
          python generate_showcase_report.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true


      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
